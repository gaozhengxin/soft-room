name: iOS test build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ios:ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Soft-Room-iOS-${{ github.sha }}
          path: artifacts/Soft-Room-unsigned.ipa*
          if-no-files-found: error
          retention-days: 7
