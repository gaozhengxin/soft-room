name: Release Android test build
on:
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync:test
        env:
          SOFT_ROOM_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/soft-room-release.p12"
          chmod 600 "$RUNNER_TEMP/soft-room-release.p12"
      - name: Build signed test APK
        env:
          SOFT_ROOM_ANDROID_KEYSTORE: ${{ runner.temp }}/soft-room-release.p12
          SOFT_ROOM_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SOFT_ROOM_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: bash android/gradlew -p android assembleBetaRelease --no-daemon
      - name: Verify and package test APK
        run: |
          apk=android/app/build/outputs/apk/beta/release/app-beta-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          grep -R -q 'releases/download/android-test/android-test-update.json' android/app/src/main/assets/public/assets
          mkdir -p artifacts
          version=$(node -p 'require("./package.json").version')
          version_name="${version}-test.${GITHUB_RUN_NUMBER}"
          unique="Soft-Room-android-${version_name}.apk"
          cp "$apk" artifacts/Soft-Room-android-test.apk
          cp "$apk" "artifacts/$unique"
          (cd artifacts && sha256sum Soft-Room-android-test.apk > Soft-Room-android-test.apk.sha256)
          (cd artifacts && sha256sum "$unique" > "${unique}.sha256")
          digest=$(sha256sum "artifacts/$unique" | cut -d ' ' -f 1)
          VERSION_NAME="$version_name" BUILD="$GITHUB_RUN_NUMBER" APK_NAME="$unique" APK_SHA256="$digest" node -e 'const fs=require("fs"); const value={channel:"test",build:Number(process.env.BUILD),version:process.env.VERSION_NAME,apkUrl:`https://github.com/gaozhengxin/soft-room/releases/download/android-test/${process.env.APK_NAME}`,sha256:process.env.APK_SHA256,publishedAt:new Date().toISOString()}; fs.writeFileSync("artifacts/android-test-update.json",JSON.stringify(value,null,2)+"\n")'
      - name: Publish test channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          version_name="${version}-test.${GITHUB_RUN_NUMBER}"
          unique="Soft-Room-android-${version_name}.apk"
          tag="android-test"
          notes="Android test channel ${version_name}, commit ${GITHUB_SHA}. Test builds update only to later test builds and install alongside the stable app."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/Soft-Room-android-test.apk artifacts/Soft-Room-android-test.apk.sha256 "artifacts/$unique" "artifacts/${unique}.sha256" artifacts/android-test-update.json --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title "Soft Room Android ${version} test ${GITHUB_RUN_NUMBER}" --notes "$notes"
          else
            gh release create "$tag" artifacts/Soft-Room-android-test.apk artifacts/Soft-Room-android-test.apk.sha256 "artifacts/$unique" "artifacts/${unique}.sha256" artifacts/android-test-update.json --target "$GITHUB_SHA" --prerelease --title "Soft Room Android ${version} test ${GITHUB_RUN_NUMBER}" --notes "$notes"
          fi
