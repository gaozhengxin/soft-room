name: iOS unsigned release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) process.exit(1)'
      - run: npm ci
      - run: npm run ios:ipa
      - name: Check unsigned package
        run: |
          unzip -tq artifacts/Soft-Room-unsigned.ipa
          if unzip -Z1 artifacts/Soft-Room-unsigned.ipa | grep -q 'embedded.mobileprovision'; then
            echo 'Refusing to release an IPA containing a provisioning profile.' >&2
            exit 1
          fi
          (cd artifacts && shasum -a 256 -c Soft-Room-unsigned.ipa.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Soft-Room-unsigned-${{ github.ref_name }}
          path: artifacts/Soft-Room-unsigned.ipa*
          if-no-files-found: error
          retention-days: 7
      - name: Publish unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/Soft-Room-unsigned.ipa \
            artifacts/Soft-Room-unsigned.ipa.sha256 \
            --verify-tag \
            --title "Soft Room $GITHUB_REF_NAME" \
            --notes-file .github/ios-release-notes.md
